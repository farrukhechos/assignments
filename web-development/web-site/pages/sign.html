<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tech house | Home</title>
    <link rel="stylesheet" href="../css/home.css">
    <link rel="stylesheet" href="../css/navbar.css">
    <link rel="stylesheet" href="../css/section.css">
    <link rel="stylesheet" href="../css/footer.css">
    <link rel="stylesheet" href="../css/sign.css">
</head>

<body>
    <div class="father">
        <header class="container">
            <!-- navbar -->
            <nav class="navbar">
                <div class="navbar-head">
                    <div>
                        <a href="./home.html">
                            <img src="../images/logo/tech-house-logo.png" alt="logo" class="logo">
                        </a>
                    </div>

                    <button class="category-btn"><a href="category.html" style="color: white;">Kategoriya</a></button>
                    <input type="text" class="search-input" placeholder="Qidiruv" />
                </div>
                <div class="phone-navbar">
                    <div>
                        <img src="../images/logo/tech-house-logo.png" alt="logo" class="logo" />
                    </div>
                    <input type="text" class="search-input-2" placeholder="Qidiruv">
                </div>
                <div class="icon-header">
                    <div class="icon">
                        <img src="..//images/icons/bag.png" alt="">
                        <a href="./cart.html">
                            <p class="icon-title">Savat</p>
                        </a>
                    </div>
                    <div class="icon">
                        <img src="..//images/icons/plans.png" alt="">
                        <a href="./pakets.html">
                            <p class="icon-title">Imtiyozlar</p>
                        </a>
                    </div>
                    <div class="icon">
                        <img src="..//images/icons/profile.png" alt="">
                        <a href="./sign.html">
                            <p class="icon-title">Kirish</p>
                        </a>
                    </div>
                </div>
            </nav>
            <!-- section -->
            <div class="section auth-section">

                <div class="auth-card">
                    <h2>Ro'yxatdan o'tish</h2>
                    <p class="auth-subtitle">Hisob yarating va imkoniyatlardan foydalaning</p>

                    <form class="auth-form">
                        <div class="form-group">
                            <label>Ism</label>
                            <input type="text" placeholder="Ismingizni kiriting" required>
                        </div>

                        <div class="form-group">
                            <label>Familiya</label>
                            <input type="text" placeholder="Familiyangizni kiriting" required>
                        </div>

                        <div class="form-group">
                            <label>Email</label>
                            <input type="email" placeholder="example@gmail.com" required>
                        </div>

                        <div class="form-group">
                            <label>Parol</label>
                            <input type="password" placeholder="Kamida 8 ta belgi" required>
                        </div>

                        <div class="form-group">
                            <label>Parolni tasdiqlash</label>
                            <input type="password" placeholder="Parolni qayta kiriting" required>
                        </div>

                        <button type="submit" class="auth-btn">Ro'yxatdan o'tish</button>

                        <p class="auth-footer">
                            Hisobingiz bormi?
                            <a href="#">Kirish</a>
                        </p>
                    </form>
                </div>

            </div>

        </header>
        <!-- footer -->
        <footer class="footer">
            <div class="footer-logo">
                <img src="../images/logo/tech-house-logo.png" alt="">
            </div>
            <div class="footer-items">
                <span class="footer-title">Aloqa</span>
                <p class="footer-label">90 999 99 99</p>
                <p class="footer-label">info@techhouse.uz</p>
                <button class="message-btn">Xabar yozish</button>
            </div>
            <div class="footer-items">
                <span class="footer-title">Malumot</span>
                <p class="footer-label">Maqolalar</p>
                <p class="footer-label">Imtiyozlar</p>
                <p class="footer-label">Savol-javob</p>
            </div>
            <div class="footer-items">
                <span class="footer-title">Ijtimoiy tarmoqlar</span>
                <div class="social-medias">
                    <img src="../images/social-media/instagram.png" alt="">
                    <img src="../images/social-media/telegram.png" alt="">
                    <img src="../images/social-media/facebook.png" alt="">
                </div>
            </div>
        </footer>
    </div>
</body>
<script src="../javascript/main.js"></script>

</html>
