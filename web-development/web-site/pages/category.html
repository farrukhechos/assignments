<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="../css/detail.css">
    <link rel="stylesheet" href="../css/navbar.css">
    <link rel="stylesheet" href="../css/footer.css">
    <link rel="stylesheet" href="../css/home.css">
    <link rel="stylesheet" href="../css/category.css">
</head>

<body>
    <header class="container">
        <!-- navbar -->
        <nav class="navbar">
            <div class="navbar-head">
                <div>
                    <a href="./home.html">
                        <img src="../images/logo/tech-house-logo.png" alt="logo" class="logo">
                    </a>
                </div>

                <button class="category-btn"><a href="category.html" style="color: white;">Kategoriya</a></button>
                <input type="text" class="search-input" placeholder="Qidiruv" />
            </div>
            <div class="phone-navbar">
                <div>
                    <img src="../images/logo/tech-house-logo.png" alt="logo" class="logo" />
                </div>
                <input type="text" class="search-input-2" placeholder="Qidiruv">
            </div>
            <div class="icon-header">
                <div class="icon">
                    <img src="..//images/icons/bag.png" alt="">
                    <a href="./cart.html">
                        <p class="icon-title">Savat</p>
                    </a>
                </div>
                <div class="icon">
                    <img src="..//images/icons/plans.png" alt="">
                    <a href="./pakets.html">
                        <p class="icon-title">Imtiyozlar</p>
                    </a>
                </div>
                <div class="icon">
                    <img src="..//images/icons/profile.png" alt="">
                    <a href="./sign.html">
                        <p class="icon-title">Kirish</p>
                    </a>
                </div>
            </div>
        </nav>
        <!-- section -->
        <div class="section">

            <div class="categories-section">
                <div class="categories-wrapper">

                    <a href="#" class="category-card" data-category="kitchen">
                        <img src="../images/kitchen/blender.png" alt="Oshxona jihozlari">
                        <span>Oshxona jihozlari</span>
                    </a>

                    <a href="#" class="category-card" data-category="cleaner">
                        <img src="../images/cleaner/plisos.png" alt="Tozalash texnikasi">
                        <span>Tozalash texnikasi</span>
                    </a>

                    <a href="#" class="category-card" data-category="heater">
                        <img src="../images/heater/elektr-heater.png" alt="Isitish va sovutish">
                        <span>Isitish & Sovutish</span>
                    </a>

                    <a href="#" class="category-card" data-category="maintenance">
                        <img src="../images/maintenance/fen.png" alt="Shaxsiy parvarish">
                        <span>Shaxsiy parvarish</span>
                    </a>

                    <a href="#" class="category-card" data-category="smart-devices">
                        <img src="../images/smart-devices/camera.png" alt="Aqlli uy">
                        <span>Aqlli uy</span>
                    </a>


                </div>


            </div>
            <div id="products"></div>
        </div>



    </header>

    <!-- footer -->
    <footer class="footer">
        <div class="footer-logo">
            <img src="../images/logo/tech-house-logo.png" alt="">
        </div>
        <div class="footer-items">
            <span class="footer-title">Aloqa</span>
            <p class="footer-label">90 999 99 99</p>
            <p class="footer-label">info@techhouse.uz</p>
            <button class="message-btn">Xabar yozish</button>
        </div>
        <div class="footer-items">
            <span class="footer-title">Malumot</span>
            <p class="footer-label">Maqolalar</p>
            <p class="footer-label">Imtiyozlar</p>
            <p class="footer-label">Savol-javob</p>
        </div>
        <div class="footer-items">
            <span class="footer-title">Ijtimoiy tarmoqlar</span>
            <div class="social-medias">
                <img src="../images/social-media/instagram.png" alt="">
                <img src="../images/social-media/telegram.png" alt="">
                <img src="../images/social-media/facebook.png" alt="">
            </div>
        </div>
    </footer>
</body>
<script src="../javascript/category.js"></script>

</html>
